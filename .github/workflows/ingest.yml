name: Weekly absconder ingest

on:
  # Mondays at 02:30 UTC (≈08:00 IST). Absconder lists can change any day —
  # weekly is a balance between freshness and respecting upstream servers.
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest-absconders
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Mumbai — absconders
        run: node scripts/ingest_absconders.mjs

      - name: Delhi — proclaimed offenders
        run: node scripts/ingest_delhi_absconders.mjs

      - name: Kolkata — WB CID most-wanted
        run: node scripts/ingest_kolkata_absconders.mjs

      - name: Pune absconders
        run: node scripts/ingest_pune_absconders.mjs

      - name: Gurugram — proclaimed offenders
        run: node scripts/ingest_gurugram_absconders.mjs

      - name: Commit & push if data changed
        run: |
          git config user.name  "crimeradar-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/cities/)" ]; then
            git add data/cities/
            git commit -m "data: refresh absconders ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
            echo "pushed updated data"
          else
            echo "no data changes; skipping commit"
          fi
