name: Monthly crime-stats ingest

on:
  # First day of each month at 03:00 UTC. Mumbai + Bangalore publish monthly,
  # Chennai publishes annually — checking once a month covers all of them
  # without spamming upstream police servers.
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Mumbai — monthly crime stats
        run: node scripts/ingest_monthly_stats.mjs

      - name: Bangalore — KSP monthly crime review
        run: node scripts/ingest_bangalore_stats.mjs

      - name: Chennai — annual crime stats (OpenCity CSVs)
        run: node scripts/ingest_chennai_stats.mjs

      - name: Delhi — annual crime stats (Delhi Police PDF)
        run: node scripts/ingest_delhi_stats.mjs

      - name: Commit & push if data changed
        run: |
          git config user.name  "crimeradar-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/cities/)" ]; then
            git add data/cities/
            git commit -m "data: refresh monthly stats ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
            echo "pushed updated data"
          else
            echo "no data changes; skipping commit"
          fi
