name: Bug report
description: Report a bug in the CrimeRadar site or build.
title: "[Bug] <short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill out the fields below so we can reproduce it.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps that consistently reproduce the issue.
      placeholder: |
        1. Go to /pune
        2. Click on Ward 12
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include console errors / screenshots if you have them.
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL where the bug happens
      placeholder: https://crimeradar.example/pune
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser & version
      placeholder: Chrome 124, Firefox 125, Safari 17.4
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 14.5, Windows 11, Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device type
      options:
        - Desktop
        - Laptop
        - Tablet
        - Mobile
        - Other
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
    validations:
      required: false
